name: build-examples

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Builds the examples against openFrameworks master with _build_examples.sh.
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      OF: ${{ github.workspace }}/of
    steps:
      - name: openFrameworks master
        run: git clone --depth 1 https://github.com/openframeworks/openFrameworks of

      # straight into of/addons so the examples' ../../.. reaches the OF root
      - uses: actions/checkout@v6
        with:
          path: of/addons/ofxImGui

      - name: ofxImGuizmo
        # its ImGuizmo submodule has an SSH URL
        run: git -c url."https://github.com/".insteadOf="git@github.com:" clone --depth 1 --recursive --shallow-submodules https://github.com/nariakiiwatani/ofxImGuizmo "$OF/addons/ofxImGuizmo"

      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=5 update -qq
          sudo "$OF/scripts/linux/ubuntu/install_dependencies.sh" -y > deps.log 2>&1 || { tail -30 deps.log; exit 1; }
          "$OF/scripts/linux/download_libs.sh"

      - name: Libraries (macOS)
        if: runner.os == 'macOS'
        run: "$OF/scripts/osx/download_libs.sh"

      - name: openFrameworks core
        run: make -C "$OF/libs/openFrameworksCompiled/project" Debug -j"$(getconf _NPROCESSORS_ONLN)"

      - name: Build the examples
        run: "$OF/addons/ofxImGui/_build_examples.sh Debug"

  # GLES / WebGL2: the OpenGL 2 backend must compile out (TARGET_OPENGLES)
  emscripten:
    name: emscripten ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: wasm32 WebGL2
            bits: 32
            webgl: 2
          - name: wasm64 WebGL2
            bits: 64
            webgl: 2
            experimental: true
          - name: wasm32 WebGL1 (GLES 2)
            bits: 32
            webgl: 1
            # example-helpers needs ofFbo multisample/blit, which WebGL 1 doesn't have
            examples: example-simple example-demo example-advanced example-fonts example-Conway example-pixeleditor
    continue-on-error: ${{ matrix.experimental == true }}
    runs-on: ubuntu-24.04
    env:
      OF: ${{ github.workspace }}/of
      BITS: ${{ matrix.bits }}
    steps:
      - name: openFrameworks master
        run: git clone --depth 1 https://github.com/openframeworks/openFrameworks of

      - uses: actions/checkout@v6
        with:
          path: of/addons/ofxImGui

      - name: Libraries
        run: BITS=${{ matrix.bits }} "$OF/scripts/emscripten/download_libs.sh"

      - name: openFrameworks core and examples
        run: |
          [ "${{ matrix.bits }}" = 64 ] && export EMSCRIPTEN_MEMORY64=1
          docker run --rm -v "$OF:/of" -e OF_ROOT=/of -e OF_WEBGL_VERSION=${{ matrix.webgl }} -e EMSCRIPTEN_MEMORY64 \
            -e EXAMPLES="${{ matrix.examples || 'example-simple example-demo example-advanced example-fonts example-helpers example-Conway example-pixeleditor' }}" \
            emscripten/emsdk:6.0.11 bash -c '
              set -e
              sed -i "s/PLATFORM_OPTIMIZATION_CFLAGS_DEBUG = .*/PLATFORM_OPTIMIZATION_CFLAGS_DEBUG = -g0/" /of/libs/openFrameworksCompiled/project/emscripten/config.emscripten.default.mk
              emmake make -C /of/libs/openFrameworksCompiled/project Debug -j"$(nproc)"
              emmake /of/addons/ofxImGui/_build_examples.sh Debug'
